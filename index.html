<!doctype html>
<html lang="pt-BR" data-tema="escuro">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Biblioteca.jogos: loja de jogos digitais</title>
  <meta name="description" content="Loja de jogos digitais para PC e consoles: 90 jogos com entrega instantânea, reembolso em até 7 dias, alertas de preço e comparador." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://gabrielooopi98-max.github.io/Biblioteca-de-jogos/" />

  <!-- Compartilhamento (WhatsApp, Discord, redes sociais) -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:site_name" content="Biblioteca.jogos" />
  <meta property="og:title" content="Biblioteca.jogos: loja de jogos digitais" />
  <meta property="og:description" content="Loja de jogos digitais para PC e consoles: 90 jogos com entrega instantânea, reembolso em até 7 dias, alertas de preço e comparador." />
  <meta property="og:url" content="https://gabrielooopi98-max.github.io/Biblioteca-de-jogos/" />
  <meta property="og:image" content="https://gabrielooopi98-max.github.io/Biblioteca-de-jogos/og-imagem.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Biblioteca.jogos: sua próxima partida começa aqui." />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Ícones: SVG nos navegadores modernos, PNG como reserva, ícone próprio no iPhone e no Android -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-title" content="Biblioteca" />

  <!-- Conexões antecipadas. As imagens da Steam são pedidas sem CORS, então o preconnect também é sem CORS
       (com "crossorigin" o navegador abriria uma conexão que nunca seria reaproveitada). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.cloudflare.steamstatic.com" />
  <link rel="preconnect" href="https://shared.akamai.steamstatic.com" />

  <!-- Arte do banner de abertura (maior elemento da tela): começa a baixar antes do JavaScript -->
  <link rel="preload" as="image" href="https://cdn.cloudflare.steamstatic.com/steam/apps/208650/library_hero.jpg" fetchpriority="high" />

  <!-- Fontes sem bloquear a primeira pintura: o texto aparece na hora e troca quando a fonte chega.
       As fontes temáticas (Soulslike e Resident Evil) ficam num pedido separado, de menor prioridade. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=Sora:wght@500..800&family=Geist+Mono:wght@500&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=Sora:wght@500..800&family=Geist+Mono:wght@500&family=Special+Elite&display=swap" />
  </noscript>

  <script>
    // Aplica o tema salvo antes da primeira pintura (evita piscar).
    try {
      var tema = JSON.parse(localStorage.getItem("bj:tema"));
      if (tema) document.documentElement.dataset.tema = tema;
    } catch (e) {}
  </script>
</head>

<body>
  <noscript>
    <p style="padding:24px;font-family:system-ui,sans-serif">A Biblioteca.jogos precisa de JavaScript ativado para funcionar.</p>
  </noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
